<!DOCTYPE html>
<html lang="pt-BR">
    <head>
         <meta charset="UTF-8">
        <link rel="stylesheet" href="css/style.css">
        <title>formulario academia de Herois</title>
    </head>

    <body>
        <header>
            <section id="inicio">
                <h3>Academia de Heróis</h3>
                <p>Inscreva-se para participar da próxima missão</p>
            </section>
        </header>
        <main>
            <section id="principal">
                 <form action="#" method="get">
                <h1>Faça sua inscrição</h1>

                <section class="string">
                    <label for="nome">Nome herói:</label>
                      <input id="nome" name="nome" type="text" required/>
                </section>

                <section class="string">
                    <label for="email">E-mail:</label>
                      <input id="email" name="email" type="email" required/>
                </section>

                <section class="string">
                     <label for="idade">Idade:</label>
                         <input id="idade" name="idade" type="number" required/>
                </section>

                <section class="string">
                    <label for="equipe">Escolha sua equipe:</label>
                    <select id="equipes" name="equipes" required>
                        <option>Escolha sua equipe</option>
                        <option>Liga da Justiça</option>
                        <option>Vingadores</option>
                        <option>X-man</option>
                    </select>
                </section>

                <h2>Qual poder você prefere?</h2>

                <section class="opcao">
                     <input id="poder" name="poder" type="radio">
                <label for="poder">Voar</label>
            </section>

            
                <section class="opcao">
                     <input id="poder" name="poder" type="radio">
                <label for="poder">SuperVelocidade</label>
            </section>

            
                <section class="opcao">
                     <input id="poder" name="poder" type="radio">
                <label for="poder">SuperForça</label>
            </section>

             <section class="opcao">
                <input id="poder" name="poder" type="checkbox">
                <label for="poder">Quero receber novas missões.</label>
                </section>

                  <section id="texto">
                     <label for="Porque">Por que você quer ser um herói?</label>
                         <textarea id="porque" name="porque" rows="7"></textarea>
                </section>
                  
                <button id="button" type="submit">Enviar inscrição</button>


                 </form>
            </section>
        </main>

        <footer>
            <p>Prática de formulários HTML</p>
        </footer>
    </body>
</html>
